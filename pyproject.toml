[project]
name = "stackoverflow-compensation-prediction"
version = "0.1.0"
description = "Predict developer compensation using Stack Overflow Annual Developer Survey data."
readme = "README.md"
authors = [
    { name = "Matin Mohammadi", email = "matinmohammadi031@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
